<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="display">
            <input type="text" placeholder="0" readonly>
        </div>
        <div class="buttons">
            <button onclick="btn(this.innerText)" class="operator">+</button>
            <button onclick="btn(this.innerText)">7</button>
            <button onclick="btn(this.innerText)">8</button>
            <button onclick="btn(this.innerText)">9</button>
            <button onclick="btn(this.innerText)" class="operator">-</button>
            <button onclick="btn(this.innerText)">4</button>
            <button onclick="btn(this.innerText)">5</button>
            <button onclick="btn(this.innerText)">6</button>
            <button onclick="btn(this.innerText)" class="operator">*</button>
            <button onclick="btn(this.innerText)">1</button>
            <button onclick="btn(this.innerText)">2</button>
            <button onclick="btn(this.innerText)">3</button>
            <button onclick="btn(this.innerText)" class="operator">/</button>
            <button onclick="btn(this.innerText)">0</button>
            <button onclick="btn(this.innerText)">.</button>
            <button onclick="btn(this.innerText)">=</button>
            <button onclick="btn(this.innerText)" class="operator">C</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
